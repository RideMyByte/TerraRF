name: Claude (auf Zuruf)

# Claude arbeitet NUR, wenn du (Repo-Owner) es auslöst:
#   * Kommentar mit "@claude …" in einem Issue oder Pull Request, oder
#   * Label "claude" an ein Issue hängen (Labels können nur Maintainer setzen).
# Kommentare oder Issues von Fremden lösen nichts aus.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [labeled]

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'claude') ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude') &&
       github.event.comment.author_association == 'OWNER')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: claude
          claude_args: --max-turns 60
