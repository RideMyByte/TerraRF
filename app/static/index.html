<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TerraRF</title>
<meta name="description" content="Plan, observe, measure and compare radio coverage for MeshCore, LoRa and amateur radio">
<meta name="theme-color" content="#0d2236">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="apple-touch-icon" href="/static/pwa/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TerraRF">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/static/style.css?v=__VERSION__">
</head>
<body class="ws-plan">
<!-- Layout: top bar · workspace rail · workspace panel · map (shared) · inspector (whatever was clicked).
     Everything inside the panel, inspector and dialogs is rendered by the modules in /static/js/. -->
<header id="topbar">
  <div class="brand"><img src="/static/icon.svg" alt="" class="logo"><span>Terra<b>RF</b></span><span id="version" class="muted"></span></div>
  <div id="projectBar">
    <input id="projectName" class="member-edit" data-i18n-title="Project name" aria-label="Project name">
    <span id="dirtyDot" data-i18n-title="Unsaved changes"></span>
    <button id="btnSave" class="member-only primary" data-i18n="Save"></button>
    <button id="btnProjectMenu" class="iconbtn" aria-haspopup="true" data-i18n-title="Projects">▾</button>
    <div id="projectMenu" class="menu hidden" role="menu"></div>
  </div>
  <div class="spacer"></div>
  <select id="langSelect" aria-label="Language"><option value="de">DE</option><option value="en">EN</option></select>
  <button id="btnAdmin" class="iconbtn admin-only" data-i18n-title="Administration">⚙</button>
  <button id="btnLogin" class="login"></button>
</header>

<nav id="rail" aria-label="Workspaces">
  <button data-ws="plan" class="active"><span class="ico">◎</span><span data-i18n="Plan"></span></button>
  <button data-ws="network"><span class="ico">⋈</span><span data-i18n="Network"></span></button>
  <button data-ws="measure"><span class="ico">⌖</span><span data-i18n="Measure"></span></button>
  <button data-ws="compare"><span class="ico">⇄</span><span data-i18n="Compare"></span></button>
  <button data-ws="report"><span class="ico">▤</span><span data-i18n="Report"></span></button>
</nav>

<aside id="panel" aria-label="Workspace">
  <div class="sheet-handle" id="panelHandle" aria-hidden="true"></div>
  <div id="panelBody">
    <section id="ws-plan" class="ws active"></section>
    <section id="ws-network" class="ws"></section>
    <section id="ws-measure" class="ws"></section>
    <section id="ws-compare" class="ws"></section>
    <section id="ws-report" class="ws"></section>
  </div>
  <footer id="panelFoot">
    <div id="status" role="status"></div>
    <div id="siteLinks" class="muted"></div>
  </footer>
</aside>

<main id="mapwrap">
  <div id="map"></div>
  <button id="btnLayers" class="mapbtn" data-i18n-title="Layers">☰ <span data-i18n="Layers"></span></button>
  <div id="layersPanel" class="floatcard hidden"></div>
  <div id="soloChip" class="hidden"></div>
  <div id="placingBanner" class="hidden"></div>
  <div id="toast" role="status"></div>
  <div id="sysbox" data-i18n-title="Server status"><span class="dot"></span><span id="sysText">…</span><span id="sysRes"></span></div>
  <section id="profile" class="hidden" aria-label="Profile"></section>
</main>

<aside id="inspector" class="hidden" aria-label="Details">
  <div class="sheet-handle" aria-hidden="true"></div>
  <div id="inspectorHead"></div>
  <nav id="inspectorTabs"></nav>
  <div id="inspectorBody"></div>
</aside>

<dialog id="loginDlg">
  <form id="loginForm" method="dialog">
    <h3 data-i18n="Log in"></h3>
    <label><span data-i18n="User"></span><input id="loginUser" autocomplete="username"></label>
    <label><span data-i18n="Password"></span><input id="loginPassword" type="password" autocomplete="current-password"></label>
    <label class="chk"><input type="checkbox" id="loginRemember"> <span data-i18n="Stay logged in on this device"></span></label>
    <div id="loginError" class="warn"></div>
    <div class="row"><button type="button" id="loginCancel" data-i18n="Cancel"></button><button class="primary" data-i18n="Log in"></button></div>
  </form>
</dialog>

<dialog id="adminDlg" class="fullscreen" aria-label="Administration"></dialog>
<dialog id="installDlg"></dialog>

<script src="/static/vendor/leaflet/leaflet.js"></script>
<script type="module" src="/static/js/main.js?v=__VERSION__"></script>
</body>
</html>
